[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calibrationcard"
version = "0.1.0"
description = "A one-page report card for how trustworthy a classifier's confidence scores are."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Chris" }]
dependencies = ["numpy==2.5.3", "pandas==3.0.6", "scipy==1.18.1", "scikit-learn==1.9.1", "flask==3.1.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10", "pillow==12.3.0"]

[project.scripts]
calibrationcard = "calibrationcard.cli:main"

[tool.setuptools.packages.find]
include = ["calibrationcard*"]

[tool.setuptools.package-data]
calibrationcard = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"calibrationcard/report.py" = ["E501"]  # HTML template lines
